<!DOCTYPE html>
<h:html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Kinvana 2024412</title>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/themes/primeone-dark.css"/>
    </h:head>
    <h:body>
        <p>HOLA KINAL</p>

        <h:form id="inicio-de-sesion">
            <div class="card">
                <h2>INICIO DE SESIÓN</h2>

                <!-- Campo de Usuario -->
                <div class="field">
                    <p:outputLabel for="usuario">USUARIO</p:outputLabel>
                    <p:inputText id="usuario" required="true" label="Usuario" value="#{bean.usuario}" />
                    <p:message for="usuario" display="icon" />
                </div>

                <!-- Campo de Contraseña -->
                <div class="field">
                    <p:outputLabel for="contrasena">CONTRASEÑA</p:outputLabel>
                    <p:password id="contrasena" required="true" label="Contraseña" value="#{bean.contrasena}" />
                    <p:message for="contrasena" display="icon" />
                </div>

                <!-- Botones -->
                <div class="field">
                    <p:commandButton value="INICIAR SESIÓN" icon="pi pi-check" class="ui-button-primary"
                                     action="#{bean.iniciarSesion}" />
                    <p:commandButton value="CANCELAR" icon="pi pi-times" class="ui-button-secondary" immediate="true" action="#{bean.cancelar}" />
                </div>
            </div>
        </h:form>
    </h:body>
</h:html>
